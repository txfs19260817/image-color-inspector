[project]
name = "image-color-inspector"
version = "0.1.0"
description = "Local image color quantization inspector with optional rembg background removal."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=1.23,<3",
    "pillow>=12.1,<13",
    "python-multipart>=0.0.9,<1",
    "rembg[gpu]>=2.0.72,<3",
    "uvicorn>=0.30,<1",
]

[tool.uv]
package = false
