<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Image Color Inspector logo</title>
  <desc id="logoDesc">A stylized color palette with an inspection ring.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf6fb"/>
      <stop offset="100%" stop-color="#f7efe1"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f7a8c"/>
      <stop offset="100%" stop-color="#2a5f45"/>
    </linearGradient>
  </defs>

  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#bg)"/>

  <circle cx="118" cy="128" r="66" fill="#fffdf8" stroke="#d9d1c3" stroke-width="8"/>

  <circle cx="88" cy="98" r="11" fill="#ff6b6b"/>
  <circle cx="120" cy="84" r="10" fill="#ffd166"/>
  <circle cx="151" cy="96" r="10" fill="#06d6a0"/>
  <circle cx="160" cy="129" r="11" fill="#4cc9f0"/>
  <circle cx="145" cy="160" r="10" fill="#7b61ff"/>

  <circle cx="116" cy="129" r="22" fill="#f5f2ea"/>

  <circle cx="170" cy="170" r="32" fill="none" stroke="url(#ring)" stroke-width="12"/>
  <line x1="191" y1="191" x2="220" y2="220" stroke="url(#ring)" stroke-width="12" stroke-linecap="round"/>
</svg>
